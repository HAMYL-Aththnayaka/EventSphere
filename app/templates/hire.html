
{% extends "base.html" %}
{% block content %}
<section class="section account-section">
  <div class="section-heading">
    <div><span class="section-label">PRIVATE VENUE REQUEST</span><h2>Find your <span>place.</span></h2><p>Request a venue for your next private event.</p></div>
  </div>
  <form id="hireForm" class="stack-form">
    <label class="form-field">
      <span>Venue</span>
      <select name="venue_id" id="hireVenue" required>
        <option value="">Loading venues...</option>
      </select>
    </label>
    <div class="form-row">
      <label class="form-field"><span>Start date & time</span><input name="start_time" type="datetime-local" required></label>
      <label class="form-field"><span>End date & time</span><input name="end_time" type="datetime-local" required></label>
    </div>
    <label class="form-field"><span>Purpose of hire</span><input name="purpose" maxlength="200" required placeholder="e.g. Birthday celebration"></label>
    <label class="form-field"><span>Expected guests</span><input name="guests" type="number" min="1" required></label>
    <button class="button button-primary" type="submit">Submit venue request</button>
  </form>
  <div id="hireStatus" class="status-message" role="status"></div>
</section>
{% endblock %}
