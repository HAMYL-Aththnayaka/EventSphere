
{% extends "base.html" %}
{% block content %}
<section class="section admin-section">
  <div class="section-heading">
    <div><span class="section-label">EVENT OPERATIONS</span><h2>Management <span>overview.</span></h2><p>Live figures and recent agent communication records.</p></div>
    <button class="button button-outline" id="refreshDashboardBtn">Refresh dashboard ↻</button>
  </div>
  <div id="dashboardStatus" class="status-message" role="status"></div>
  <div class="stats-grid" id="dashboardStats"></div>
  <h3 class="subheading">Event performance</h3>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Event</th><th>Tickets sold</th><th>Revenue</th><th>Check-ins</th><th>Remaining</th></tr></thead>
      <tbody id="dashboardEvents"></tbody>
    </table>
  </div>
  <h3 class="subheading">Recent agent messages</h3>
  <div class="agent-log" id="agentLogs"></div>
</section>
{% endblock %}
